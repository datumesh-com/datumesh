name: release

# When a tag v<version> is pushed (after datumesh-local of the same version is on crates.io):
# the test workflow must pass and the tag must equal the crate's version; then the datumesh
# binary is built for Linux (x86_64, aarch64), macOS (aarch64, x86_64) and Windows (x86_64)
# and attached to the GitHub release of the tag, and the crate is published to crates.io
# through Trusted Publishing (OIDC). A version already on crates.io is skipped rather than
# failing the run.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    uses: ./.github/workflows/test.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tag equals the crate's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          v="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          echo "tag $GITHUB_REF_NAME, datumesh $v"
          test "$tag" = "$v"

  # Not after publish: the binaries are built and attached whether or not the crate was
  # published by this run (0.1.0 is first published with a token).
  binaries:
    needs: [test, version]
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, archive: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-latest, archive: tar.gz } # cross-built on arm64
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99 --profile minimal --target ${{ matrix.target }} && rustup default 1.99
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: archive
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          name="datumesh-$v-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            cp "target/${{ matrix.target }}/release/datumesh.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/datumesh" "$name/"
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "$ASSET" > "$ASSET.sha256"; else shasum -a 256 "$ASSET" > "$ASSET.sha256"; fi
      - name: attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "datumesh ${GITHUB_REF_NAME#v}" --notes "The datumesh binary of datumesh-local ${GITHUB_REF_NAME#v}." || true
          gh release upload "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --clobber

  publish:
    needs: [test, version]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99 --profile minimal && rustup default 1.99
      # A version already on crates.io (0.1.0 is first published with a token, before Trusted
      # Publishing is configured) is skipped rather than failing the run.
      - name: versions already published
        id: published
        run: |
          v="${GITHUB_REF_NAME#v}"
          for c in datumesh; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -A 'datumesh release (github.com/datumesh-com/datumesh)' "https://crates.io/api/v1/crates/$c/$v")"
            if [ "$code" = 200 ]; then out=true; else out=false; fi
            echo "$c $v published: $out"
            echo "${c//-/_}=$out" >> "$GITHUB_OUTPUT"
          done
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.published.outputs.datumesh != 'true'
      - run: cargo publish --locked
        if: steps.published.outputs.datumesh != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
