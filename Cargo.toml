[package]
name = "datumesh"
version = "0.1.1"
description = "The datumesh command: the Datumesh local resolver (get, define, publish, explain, find, prefetch, refresh, export, import, verify, serve). The library is datumesh-local."
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/datumesh-com/datumesh"
homepage = "https://datumesh.com"
documentation = "https://docs.rs/datumesh-local"
readme = "README.md"
keywords = ["datumesh", "receipt", "provenance", "cli", "resolver"]
categories = ["command-line-utilities"]
include = ["/src/**/*.rs", "/Cargo.toml", "/LICENSE", "/README.md"]

[[bin]]
name = "datumesh"
path = "src/main.rs"

[dependencies]
datumesh-local = "0.1.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
